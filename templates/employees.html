<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Employee List</title>
        <meta charset="utf-8">
    </head>
    <body>
        <table>
            <tr>
                <th>Name</th><th>Last
                    Name</th><th>GSM</th><th>Address</th><th>Type</th><th>Gender</th><th></th>
            </tr>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.name }}</td>
                <td>{{ emp.fname }}</td>
                <td>{{ emp.gsm }}</td>
                <td>{{ emp.adr }}</td>
                <td>{{ emp.type }}</td>
                <td>{{ emp.gender }}</td>
                <td>
                    <form
                        action="{{ url_for('employee.edit_employee_form', employee_id=emp.id) }}"
                        method="get" style="display:inline;">
                        <button type="submit">Edit</button>
                    </form>
                    <form
                        action="{{ url_for('employee.delete_employee', employee_id=emp.id) }}"
                        method="post"
                        onsubmit="return confirm('Delete {{ emp.name }} {{ emp.fname }}?');"
                        style="display:inline;">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="{{ url_for('employee.show_form') }}">Add Employee</a></p>
    </body>
</html>
