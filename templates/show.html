<!doctype html>
<head>
  <title>add employees</title>
  <meta charset="utf-8">
  <meta lang="en">
</head>
<body>
  <h2>Add Employee</h2>
  <form action="{{ url_for('employee.add_employee') }}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" maxlength="45" required><br><br>

    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" maxlength="45" required><br><br>

    <label for="gsm">GSM (Phone):</label>
    <input type="text" id="gsm" name="gsm" maxlength="45" required><br><br>

    <label for="adr">Address:</label>
    <input type="text" id="adr" name="adr" maxlength="45" required><br><br>

    <label for="type">Type:</label>
    <select id="type" name="type" required>
      <option value>-- Select --</option>
      <option value="manager">Manager</option>
      <option value="driver">Driver</option>
      <option value="stocker">Stocker</option>
      <option value="financer">Financer</option>
    </select><br><br>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
      <option value>-- Select --</option>
      <option value="M">Male</option>
      <option value="F">Female</option>
    </select>

    <button type="submit">Add Employee</button>
  </form>
  <h1><a href="{{ url_for('employee.get_employees') }}">Show Employees</a></h1>
</body>
